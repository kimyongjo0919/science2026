<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>광남고등학교 과학과 예산관리</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#1565C0;--navy3:#0D47A1;--gold:#c9a84c;
  --offwhite:#f6f5f1;--surface:#fff;--border:rgba(13,31,60,0.12);
  --text:#0d1f3c;--text2:#4a5568;--text3:#8896a8;
  --red:#b83232;--green:#1a6644;
  --radius:10px;--shadow:0 4px 20px rgba(13,31,60,0.10);
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--offwhite);color:var(--text);min-height:100vh;}
header{background:var(--navy);color:#fff;padding:0 1.5rem;}
.header-inner{max-width:1000px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:16px;font-weight:700;letter-spacing:1px;}
header .sub{font-size:11px;color:var(--gold);}
.gold-bar{height:3px;background:linear-gradient(90deg,var(--gold),#e8c96a,var(--gold));}
.nav-tabs{background:var(--navy3);display:flex;max-width:1000px;margin:0 auto;overflow-x:auto;}
.nav-tab{padding:12px 18px;background:none;border:none;color:rgba(255,255,255,0.55);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border-bottom:3px solid transparent;}
.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.container{max-width:1000px;margin:0 auto;padding:1.5rem;}
.page{display:none;}
.page.active{display:block;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.4rem;box-shadow:var(--shadow);margin-bottom:1.2rem;}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--navy3);margin-bottom:1rem;}
label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:600;}
select,input[type="date"],input[type="number"],input[type="text"],textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;
  font-size:14px;font-family:inherit;margin-bottom:14px;background:#fff;color:var(--text);
}
textarea{resize:vertical;min-height:60px;}
.btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:hover{background:var(--navy3);}
.btn.danger{background:var(--red);}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--text2);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;}
th{color:var(--text3);font-size:11px;text-transform:uppercase;}
tr:hover td{background:#fafbff;}
.right{text-align:right;}
.bar-track{background:#eef0f8;border-radius:10px;height:16px;overflow:hidden;width:100%;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--navy),var(--navy3));border-radius:10px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy3);color:#fff;
  padding:10px 20px;border-radius:8px;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,0.2);opacity:0;
  transition:opacity 0.2s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;}
.empty{text-align:center;color:var(--text3);padding:2rem;font-size:13px;}
.actions button{margin-right:4px;font-size:12px;padding:4px 8px;}
.setup-warning{background:#fdf0f0;border:1px solid #e8c0c0;color:var(--red);padding:1rem;border-radius:8px;margin-bottom:1rem;font-size:13px;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <h1>광남고등학교 과학과 예산관리</h1>
      <div class="sub">BUDGET MANAGER</div>
    </div>
  </div>
</header>
<div class="gold-bar"></div>
<div class="nav-tabs">
  <button class="nav-tab active" onclick="goPage(0)">📊 예산 현황</button>
  <button class="nav-tab" onclick="goPage(1)">✏️ 지출 입력</button>
  <button class="nav-tab" onclick="goPage(2)">📋 지출 내역 (수정·삭제)</button>
</div>

<div class="container">
  <div id="setupWarning"></div>

  <!-- 예산 현황 -->
  <div class="page active" id="page0">
    <div class="card">
      <h2>예산 현황</h2>
      <table id="statusTable">
        <thead><tr><th>세부사업</th><th>항목</th><th class="right">배정예산</th><th class="right">지출</th><th class="right">잔액</th><th style="width:120px;">집행률</th></tr></thead>
        <tbody id="statusBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 지출 입력 -->
  <div class="page" id="page1">
    <div class="card">
      <h2>지출 입력</h2>
      <label>담당자</label>
      <select id="inTeacher"></select>
      <label>예산 항목</label>
      <select id="inItem"></select>
      <label>날짜</label>
      <input type="date" id="inDate">
      <label>금액 (원)</label>
      <input type="number" id="inAmount" placeholder="예: 30000">
      <label>메모 (어디에 사용했는지)</label>
      <textarea id="inMemo" placeholder="예: 실험 재료 구입 - OO문구"></textarea>
      <button class="btn" onclick="submitExpense()">입력하기</button>
    </div>
  </div>

  <!-- 지출 내역 -->
  <div class="page" id="page2">
    <div class="card">
      <h2>지출 내역</h2>
      <table>
        <thead><tr><th>날짜</th><th>담당자</th><th>항목</th><th class="right">금액</th><th>메모</th><th style="width:110px;">관리</th></tr></thead>
        <tbody id="recordsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var DEPT_NAME = "광남고등학교 과학과";
var BUDGETS = [{"project":"[자율]미래 역량 함양을 위한 다영역 창의·융합 통합 교육","item":"미래아카데미 강사비","amount":4000000},{"project":"[자율]미래 역량 함양을 위한 다영역 창의·융합 통합 교육","item":"체육축제 운영비","amount":3500000},{"project":"[자율]미래 역량 함양을 위한 다영역 창의·융합 통합 교육","item":"탐구체험 프로젝트 강사비","amount":1000000},{"project":"[자율]미래 역량 함양을 위한 다영역 창의·융합 통합 교육","item":"예술활동 프로젝트 운영비","amount":1000000},{"project":"[자율]미래 역량 함양을 위한 다영역 창의·융합 통합 교육","item":"미래아카데미 운영비","amount":2000000},{"project":"[자율]미래 역량 함양을 위한 다영역 창의·융합 통합 교육","item":"탐구체험 프로젝트 운영비","amount":6000000},{"project":"[목적]공동교육과정운영","item":"공동교육과정 강사수당","amount":4800000},{"project":"[목적]공동교육과정운영","item":"공동교육과정 수업 재료비","amount":2840000},{"project":"[목적]주도성을 키우는 교육과정 선도학교","item":"과학오픈클래스 강사수당","amount":1170000},{"project":"[목적]주도성을 키우는 교육과정 선도학교","item":"교과융합프로그램 운영비","amount":5000000},{"project":"[목적]주도성을 키우는 교육과정 선도학교","item":"교육과정 선도학교 위원회 협의회비","amount":1000000},{"project":"[목적]주도성을 키우는 교육과정 선도학교","item":"창의융합과학프로그램 운영비","amount":3000000},{"project":"[목적]주도성을 키우는 교육과정 선도학교","item":"과학오픈클래스 운영비","amount":130000},{"project":"[목적]주도성을 키우는 교육과정 선도학교","item":"지속가능발전프로젝트 운영비","amount":2700000},{"project":"[목적]주도성을 키우는 교육과정 선도학교","item":"학생자치회 멘토멘티 운영비","amount":2000000},{"project":"[시보조]고교학점제 운영지원(학업경로설계)","item":"과학심화활동(전공심화활동) 강사비","amount":930000},{"project":"[시보조]고교학점제 운영지원(학업경로설계)","item":"과학심화활동(전공심화활동) 재료비","amount":570000},{"project":"[시보조]고교학점제 운영지원(학업경로설계)","item":"과학탐구실험 협력강사 기관부담금","amount":300000},{"project":"[시보조]고교학점제 운영지원(학업경로설계)","item":"과학탐구실험 협력강사비","amount":8448000},{"project":"[시보조]고교학점제 운영지원(학업경로설계)","item":"과학심화활동(전공심화활동) 간식비","amount":200000},{"project":"[시보조]고교학점제 운영지원(학업경로설계)","item":"모의면접 강사비","amount":4560000},{"project":"[시보조]고교학점제 운영지원(학업경로설계)","item":"진로설계프로그램 운영비","amount":5000000},{"project":"[시보조]고교학점제 운영지원(학업경로설계)","item":"창체동아리 재료비","amount":992000},{"project":"[목적]융합교육(STEAM) 클럽 운영","item":"융합교육 클럽 초빙 강사수당","amount":400000},{"project":"[목적]융합교육(STEAM) 클럽 운영","item":"융합교육 클럽 운영비","amount":1850000},{"project":"[목적]융합교육(STEAM) 클럽 운영","item":"융합교육 클럽 협의회비","amount":250000},{"project":"과학교과운영","item":"과학행사 운영","amount":3000000},{"project":"과학교과운영","item":"과학교과활동비","amount":2000000},{"project":"과학교과운영","item":"과학교구 구입","amount":5000000},{"project":"과학교과운영","item":"과학과 교재 제작","amount":4000000},{"project":"과학교과운영","item":"과학실험실습 재료 구입","amount":6000000},{"project":"교장실운영","item":"[업무추진비]학생격려","amount":200000},{"project":"교장실운영","item":"직책급업무추진비","amount":3960000},{"project":"교장실운영","item":"[업무추진비]내빈접대물품구입","amount":2510000},{"project":"교장실운영","item":"[업무추진비]교직원간담회비","amount":9780000},{"project":"교장실운영","item":"[업무추진비]외부인접대경비","amount":540000},{"project":"교장실운영","item":"[업무추진비]경조사비","amount":500000},{"project":"교장실운영","item":"[업무추진비]교과협의회경비","amount":3910000},{"project":"교장실운영","item":"[업무추진비]지필평가운영경비","amount":400000},{"project":"교장실운영","item":"[업무추진비]학생부협의회경비","amount":200000},{"project":"교무실운영","item":"사무용품 구입","amount":3500000},{"project":"교무실운영","item":"특근매식비","amount":9180000},{"project":"교무실운영","item":"특근매식비(삭제)","amount":0},{"project":"교무실운영","item":"이전비","amount":3000000},{"project":"교무실운영","item":"관내외 출장비","amount":54000000}];      // [{project, item, amount}]
var TEACHERS = ["김용조","김시원","권세진","변유진","이소정"];    // ["이름1","이름2",...]
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzUqwQbbrc8oQaRGTaqyyThadbhONcD1U2ZevTtjd77PY1Ligle8SJ-GPciMqlup5lq9g/exec";

var records = [];
var editingId = null;

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

function goPage(i){
  document.querySelectorAll('.page').forEach(function(p,idx){ p.classList.toggle('active', idx===i); });
  document.querySelectorAll('.nav-tab').forEach(function(t,idx){ t.classList.toggle('active', idx===i); });
}

function itemKey(project, item){ return project + ' :: ' + item; }

function populateSelectors(){
  var tSel = document.getElementById('inTeacher');
  tSel.innerHTML = TEACHERS.map(function(t){ return '<option value="'+t+'">'+t+'</option>'; }).join('');

  var iSel = document.getElementById('inItem');
  iSel.innerHTML = BUDGETS.map(function(b){
    return '<option value="'+itemKey(b.project,b.item)+'">['+b.project+'] '+b.item+' (배정 '+b.amount.toLocaleString()+'원)</option>';
  }).join('');

  document.getElementById('inDate').value = new Date().toISOString().slice(0,10);
}

function apiCall(params){
  var qs = Object.keys(params).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&');
  return fetch(APPS_SCRIPT_URL + '?' + qs).then(function(r){ return r.json(); });
}

function loadAll(){
  apiCall({action:'list'}).then(function(res){
    if(!res.ok){ showToast('불러오기 실패: '+(res.error||'')); return; }
    records = res.records || [];
    renderRecords();
    renderStatus();
  }).catch(function(e){ showToast('서버 연결 실패 — APPS_SCRIPT_URL을 확인하세요'); });
}

function renderStatus(){
  var body = document.getElementById('statusBody');
  if(BUDGETS.length===0){ body.innerHTML = '<tr><td colspan="6" class="empty">등록된 예산 항목이 없습니다</td></tr>'; return; }
  body.innerHTML = BUDGETS.map(function(b){
    var key = itemKey(b.project,b.item);
    var spent = records.filter(function(r){ return itemKey(r.project,r.item)===key; })
                        .reduce(function(s,r){ return s+r.amount; }, 0);
    var remain = b.amount - spent;
    var pct = b.amount>0 ? Math.min(100, Math.round(spent/b.amount*100)) : 0;
    var barColor = pct>=90 ? 'var(--red)' : (pct>=70 ? 'var(--gold)' : 'var(--navy)');
    return '<tr><td>'+b.project+'</td><td>'+b.item+'</td>'
      + '<td class="right">'+b.amount.toLocaleString()+'</td>'
      + '<td class="right">'+spent.toLocaleString()+'</td>'
      + '<td class="right">'+remain.toLocaleString()+'</td>'
      + '<td><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+barColor+';"></div></div></td></tr>';
  }).join('');
}

function renderRecords(){
  var body = document.getElementById('recordsBody');
  if(records.length===0){ body.innerHTML = '<tr><td colspan="6" class="empty">아직 입력된 지출 내역이 없습니다</td></tr>'; return; }
  var sorted = records.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  body.innerHTML = sorted.map(function(r){
    return '<tr><td>'+r.date+'</td><td>'+r.teacher+'</td><td>['+r.project+'] '+r.item+'</td>'
      + '<td class="right">'+r.amount.toLocaleString()+'</td><td>'+(r.memo||'')+'</td>'
      + '<td class="actions"><button class="btn ghost" onclick="startEdit(\''+r.id+'\')">수정</button>'
      + '<button class="btn danger" onclick="removeRecord(\''+r.id+'\')">삭제</button></td></tr>';
  }).join('');
}

function submitExpense(){
  var key = document.getElementById('inItem').value;
  var parts = key.split(' :: ');
  var payload = {
    action: editingId ? 'update' : 'add',
    date: document.getElementById('inDate').value,
    teacher: document.getElementById('inTeacher').value,
    project: parts[0], item: parts[1],
    amount: document.getElementById('inAmount').value,
    memo: document.getElementById('inMemo').value
  };
  if(!payload.amount){ showToast('금액을 입력해주세요'); return; }
  if(editingId) payload.id = editingId;

  apiCall(payload).then(function(res){
    if(!res.ok){ showToast('저장 실패: '+(res.error||'')); return; }
    showToast(editingId ? '수정되었습니다' : '입력되었습니다');
    editingId = null;
    document.getElementById('inAmount').value = '';
    document.getElementById('inMemo').value = '';
    loadAll();
    goPage(2);
  });
}

function startEdit(id){
  var r = records.find(function(x){ return x.id===id; });
  if(!r) return;
  editingId = id;
  document.getElementById('inTeacher').value = r.teacher;
  document.getElementById('inItem').value = itemKey(r.project, r.item);
  document.getElementById('inDate').value = r.date;
  document.getElementById('inAmount').value = r.amount;
  document.getElementById('inMemo').value = r.memo;
  goPage(1);
  showToast('수정할 내용을 고친 뒤 "입력하기"를 누르세요');
}

function removeRecord(id){
  if(!confirm('이 지출 내역을 삭제할까요?')) return;
  apiCall({action:'delete', id:id}).then(function(res){
    if(!res.ok){ showToast('삭제 실패: '+(res.error||'')); return; }
    showToast('삭제되었습니다');
    loadAll();
  });
}

document.addEventListener('DOMContentLoaded', function(){
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_') === 0){
    document.getElementById('setupWarning').innerHTML =
      '<div class="setup-warning">⚠️ 아직 APPS_SCRIPT_URL이 설정되지 않았습니다. index.html 안의 APPS_SCRIPT_URL 값을 배포한 구글 Apps Script 웹 앱 URL로 바꿔주세요.</div>';
  }
  populateSelectors();
  loadAll();
});
</script>
</body>
</html>
